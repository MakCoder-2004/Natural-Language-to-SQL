services:
  index-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${INDEX_DB_NAME:-schema_index}
      POSTGRES_USER: ${INDEX_DB_USER:-index_user}
      POSTGRES_PASSWORD: ${INDEX_DB_PASSWORD:?INDEX_DB_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - index_db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
      INDEX_DATABASE_URL: ${INDEX_DATABASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-}
      QUESTION_MODEL: ${QUESTION_MODEL:-nex-agi/nex-n2.5-pro:free}
      SQL_MODEL: ${SQL_MODEL:-nex-agi/nex-n2.5-pro:free}
      SQL_CORRECTION_MODEL: ${SQL_CORRECTION_MODEL:-nex-agi/nex-n2.5-pro:free}
      ANSWER_MODEL: ${ANSWER_MODEL:-nex-agi/nex-n2.5-pro:free}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      SOURCE_SCHEMA_SCOPE: ${SOURCE_SCHEMA_SCOPE:-public}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-60}
      STRICT_SEMANTIC_METADATA: ${STRICT_SEMANTIC_METADATA:-false}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      SOURCE_POOL_SIZE: ${SOURCE_POOL_SIZE:-5}
      SOURCE_MAX_OVERFLOW: ${SOURCE_MAX_OVERFLOW:-10}
      SOURCE_POOL_TIMEOUT_SECONDS: ${SOURCE_POOL_TIMEOUT_SECONDS:-10}
      SOURCE_POOL_RECYCLE_SECONDS: ${SOURCE_POOL_RECYCLE_SECONDS:-1800}
      INDEX_POOL_SIZE: ${INDEX_POOL_SIZE:-5}
      INDEX_MAX_OVERFLOW: ${INDEX_MAX_OVERFLOW:-10}
      INDEX_POOL_TIMEOUT_SECONDS: ${INDEX_POOL_TIMEOUT_SECONDS:-10}
      INDEX_POOL_RECYCLE_SECONDS: ${INDEX_POOL_RECYCLE_SECONDS:-1800}
      MAX_CORRECTION_RETRIES: ${MAX_CORRECTION_RETRIES:-2}
      MAX_REGENERATION_COUNT: ${MAX_REGENERATION_COUNT:-3}
      MAX_RETURNED_ROWS: ${MAX_RETURNED_ROWS:-1000}
      MAX_RESULT_BYTES: ${MAX_RESULT_BYTES:-5000000}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      index-db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  index_db_data:
